<style>

button.on,nav button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}nav button{white-space:nowrap}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

<header><b>♥ ECG &amp; ACLS Master Lab</b><button id="th">Modo claro / oscuro</button></header><nav id="nav"></nav><main id="m"></main>
<script>
const $=s=>document.querySelector(s),G_=(d,m,s,a)=>a*Math.exp(-((d-m)**2)/(2*s*s));
function wave(d,k,a){const g=G_;switch(k){
case'p':return g(d,0,.028,.13);case'pa':return g(d,0,.028,-.1);
case'Q':return g(d,-.022,.008,-.12)+g(d,0,.011,1.1)+g(d,.024,.01,-.22)+g(d,.27,.05,.32);
case'W':return g(d,0,.05,1)+g(d,.07,.04,-.15)+g(d,.3,.07,-.3);
case'R':return g(d,-.03,.01,.15)+g(d,0,.012,.35)+g(d,.03,.015,-.4)+g(d,.075,.02,.7)+g(d,.32,.06,-.3);
case'L':return g(d,0,.025,.8)+g(d,.05,.02,.7)+g(d,.12,.04,-.1)+g(d,.33,.07,-.4);
case'D':return g(d,-.05,.025,.22)+wave(d,'Q');
case'S':return g(d,-.03,.0035,1.4)+g(d,0,.045,.9)+g(d,.3,.07,-.4);
case'k':return g(d,0,.0035,1.4);case'V':return Math.abs(d)<a/2?.95*Math.sin(6.283*d/a)+.28*Math.sin(12.566*d/a+1.2):0}return 0}
const NS=(h)=>60/h,P16=[[0,'p'],[.16,'Q']];
const RT=[
['nsr','Ritmo sinusal normal','Sinusales',75,60,100,'P antes de cada QRS, PR 0,12–0.20 s, QRS estrecho, FC 60–100.',(s,h)=>[P16,NS(h)]],
['brad','Bradicardia sinusal','Sinusales',45,30,59,'Ritmo sinusal con FC &lt; 60. Tratar solo si hay inestabilidad.',(s,h)=>[P16,NS(h)]],
['tach','Taquicardia sinusal','Sinusales',130,101,180,'Ritmo sinusal con FC &gt; 100; buscar causa (fiebre, dolor, hipovolemia).',(s,h)=>[P16,NS(h)]],
['asr','Arritmia sinusal respiratoria','Sinusales',70,55,95,'P normales con intervalo RR que varía con la respiración (variante normal).',(s,h)=>[P16,NS(h)*(1+.22*Math.sin(s.k*.75))]],
['sss','Pausa / paro sinusal (seno enfermo)','Sinusales',70,50,100,'Pausas sinusales de varios segundos sin P ni QRS; escapes y bradi-taqui.',(s,h)=>s.k%6==5?[P16,3.4]:[P16,NS(h)]],
['pac','Extrasístoles auriculares (PAC)','Auriculares / SV',75,50,110,'P prematura de morfología distinta, QRS estrecho, pausa no compensadora.',(s,h)=>{const m=s.k%4;return m==2?[P16,NS(h)*.62]:m==3?[[[0,'pa'],[.14,'Q']],NS(h)*1.15]:[P16,NS(h)]}],
['af','Fibrilación auricular (resp. rápida)','Auriculares / SV',130,60,180,'Sin ondas P, línea base fibrilar, RR totalmente irregular. Con FC &lt; 100 = respuesta controlada.',(s,h)=>[[[0,'Q']],Math.max(.3,(.6+.8*Math.random())*60/h)],t=>.035*(Math.sin(43*t)+Math.sin(58*t+1)+Math.sin(31*t+2))],
['flut','Flutter auricular (conducción 2:1 a 4:1)','Auriculares / SV',150,75,150,'Ondas F en «dientes de sierra» a 300/min. FC 150 = 2:1; 100 = 3:1; 75 = 4:1.',(s,h)=>{const n=Math.max(2,Math.round(300/h));return[[[0,'Q']],n*.2]},t=>.2*(.5-((t*5)%1))],
['svt','TSV paroxística (TRIN / TRAV)','Auriculares / SV',185,150,250,'Regular, QRS estrecho, 150–250/min, sin P visibles; inicio y fin bruscos.',(s,h)=>[[[0,'Q']],NS(h)]],
['wpw','Wolff-Parkinson-White','Auriculares / SV',75,55,110,'PR corto (&lt; 0,12 s) y onda delta (empastamiento inicial del QRS). Evitar nodales en FA preexcitada.',(s,h)=>[[[0,'p'],[.1,'D']],NS(h)]],
['junc','Ritmo de escape de la unión','Unión',45,35,60,'Sin P (o P retrógrada), QRS estrecho, 40–60/min.',(s,h)=>[[[0,'Q']],NS(h)]],
['accj','Ritmo de la unión acelerado','Unión',80,60,100,'Unión con 60–100/min, QRS estrecho sin P.',(s,h)=>[[[0,'Q']],NS(h)]],
['tj','Taquicardia de la unión','Unión',120,100,180,'Unión &gt; 100/min; sospechar intoxicación digitálica.',(s,h)=>[[[0,'Q']],NS(h)]],
['pvc','Extrasístoles ventriculares aisladas','Ventriculares',75,50,110,'QRS prematuro, ancho (&gt; 0,12 s), sin P, T opuesta, pausa compensadora.',(s,h)=>s.k%4==3?[[[0,'p'],[.16,'Q'],[.16+.5*NS(h),'W']],2.1*NS(h)]:[P16,NS(h)]],
['bigem','Bigeminismo ventricular','Ventriculares',75,50,110,'Un latido sinusal seguido de una PVC, alternando.',(s,h)=>[[[0,'p'],[.16,'Q'],[.16+.55*NS(h),'W']],1.55*NS(h)]],
['trigem','Trigeminismo ventricular','Ventriculares',75,50,110,'Dos latidos sinusales seguidos de una PVC.',(s,h)=>[[[0,'p'],[.16,'Q'],[NS(h),'p'],[NS(h)+.16,'Q'],[.16+1.55*NS(h),'W']],2.6*NS(h)]],
['riva','Ritmo idioventricular acelerado (RIVA)','Ventriculares',70,40,100,'QRS ancho regular 40–100/min sin P; típico tras reperfusión.',(s,h)=>[[[0,'W']],NS(h)]],
['vt','TV monomórfica CON pulso','Ventriculares',170,120,250,'Complejos anchos regulares &gt; 120/min. Evaluar estabilidad.',(s,h)=>[[[0,'V',NS(h)]],NS(h)]],
['vtsp','TV SIN pulso','Ventriculares',190,120,250,'Mismo trazado que TV, paciente sin pulso: tratar como FV (desfibrilar).',(s,h)=>[[[0,'V',NS(h)]],NS(h)]],
['tors','TV polimórfica / Torsades de Pointes','Ventriculares',200,150,250,'QRS que giran en torno a la línea de base; QT largo previo. Magnesio 2 g.',(s,h)=>[[],1],t=>1.1*Math.sin(26.4*t)*Math.abs(Math.sin(1.31*t))],
['vff','Fibrilación ventricular gruesa','Ventriculares',0,0,0,'Ondulaciones caóticas de gran amplitud: desfibrilación inmediata.',(s,h)=>[[],1],t=>.9*(Math.sin(27*t)+.8*Math.sin(39*t+2)+.7*Math.sin(19*t+1))*(.6+.4*Math.sin(2.3*t))*.55],
['vfn','Fibrilación ventricular fina','Ventriculares',0,0,0,'Ondulación de baja amplitud; verificar ganancia y cables antes de pensar en asistolia.',(s,h)=>[[],1],t=>.25*(Math.sin(31*t)+.8*Math.sin(43*t+2)+.7*Math.sin(17*t+1))*(.6+.4*Math.sin(2.7*t))],
['av1','Bloqueo AV 1.er grado','Bloqueos',70,45,100,'PR fijo &gt; 0,20 s, toda P conduce.',(s,h)=>[[[0,'p'],[.36,'Q']],NS(h)]],
['mob1','Bloqueo AV 2.º grado Mobitz I (Wenckebach)','Bloqueos',80,60,100,'PR se alarga progresivamente hasta que una P no conduce; RR se acorta.',(s,h)=>{const r=NS(h);return[[[0,'p'],[.16,'Q'],[r,'p'],[r+.26,'Q'],[2*r,'p'],[2*r+.38,'Q'],[3*r,'p']],4*r]}],
['mob2','Bloqueo AV 2.º grado Mobitz II','Bloqueos',80,60,100,'PR constante con P bloqueadas súbitamente; riesgo de BAV completo: marcapasos.',(s,h)=>{const r=NS(h);return[[[0,'p'],[.16,'Q'],[r,'p'],[r+.16,'Q'],[2*r,'p']],3*r]}],
['cav','Bloqueo AV 3.er grado (completo)','Bloqueos',35,25,55,'Disociación AV: P y QRS independientes. Escape ancho/lento = infrahisiano (grave); estrecho = suprahisiano.',(s,h)=>{const e=[];for(let t=0;t<10;t+=.8)e.push([t,'p']);for(let t=.3;t<10;t+=60/h)e.push([t,'W']);return[e,10]}],
['brd','Bloqueo de rama derecha (BRDHH)','Bloqueos',75,50,110,'QRS &gt; 0,12 s, rSR’ en V1, S ancha en DI/V6.',(s,h)=>[[[0,'p'],[.16,'R']],NS(h)]],
['bri','Bloqueo de rama izquierda (BRIHH)','Bloqueos',75,50,110,'QRS &gt; 0,12 s, R ancha con muesca en DI/V6, T opuesta. Usar Sgarbossa.',(s,h)=>[[[0,'p'],[.16,'L']],NS(h)]],
['asis','Asistolia','Paro / dispositivos',0,0,0,'Línea isoeléctrica: confirmar en 2 derivaciones, cables y ganancia. No desfibrilable.',(s,h)=>[[],1],t=>.012*Math.sin(17*t)],
['aesp','AESP (actividad eléctrica sin pulso)','Paro / dispositivos',40,20,100,'Ritmo organizado sin pulso palpable. Buscar 5H y 5T.',(s,h)=>[[[0,'W']],NS(h)]],
['pacv','Marcapasos ventricular (captura normal)','Paro / dispositivos',70,50,110,'Espiga seguida de QRS ancho (morfología de BRIHH).',(s,h)=>[[[0,'S']],NS(h)]],
['pacf','Marcapasos con fallo de captura','Paro / dispositivos',70,50,110,'Espigas sin QRS posterior: falla de captura (revisar umbral/electrodo).',(s,h)=>s.k%3==2?[[[0,'k']],NS(h)]:[[[0,'S']],NS(h)]]
].reduce((o,r)=>(o[r[0]]={id:r[0],n:r[1],c:r[2],hr:r[3],mn:r[4],mx:r[5],cr:r[6],cy:r[7],b:r[8]},o),{});
const NOP=['vtsp','vff','vfn','asis','aesp'];
const M={now:0,tg:0,ev:[],st:{k:0},id:'nsr',hr:75,pause:false,beep:false,sp:25,g:10,cal:[],on:false,last:0};
function setR(id,hr){M.id=id;M.hr=hr||RT[id].hr||60;M.ev=[];M.st={k:0};M.tg=M.now-14}
function fill(){const r=RT[M.id];while(M.tg<M.now+1){const[e,d]=r.cy(M.st,M.hr||60);for(const x of e)M.ev.push([M.tg+x[0],x[1],x[2]]);M.tg+=d;M.st.k++}M.ev=M.ev.filter(e=>e[0]>M.now-14)}
const fM=t=>{const r=RT[M.id];let v=(r.b?r.b(t,M.hr):0)+(M.fw?RT[M.fw].b(t,M.hr):0);for(const e of M.ev){const d=t-e[0];if(d>-.4&&d<.7)v+=wave(d,e[1],e[2])}return v*(M.amp||1)};
function colors(){const s=getComputedStyle(document.documentElement);return{g1:s.getPropertyValue('--g1'),g2:s.getPropertyValue('--g2'),tr:s.getPropertyValue('--tr')}}
function draw(cv,f,o){cv.style.height=(cv.getAttribute('height')||150)+'px';const W=cv.clientWidth,H=cv.clientHeight,d=devicePixelRatio||1;if(cv.width!=Math.round(W*d)){cv.width=Math.round(W*d);cv.height=Math.round(H*d)}
const c=cv.getContext('2d'),C=colors(),pm=o.pm||3.6,secs=W/pm/o.sp,mid=H*(o.mid||.5);c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,W,H);c.lineWidth=1;
for(let i=0;i*pm<=W;i++){c.strokeStyle=i%5?C.g1:C.g2;c.beginPath();c.moveTo(i*pm,0);c.lineTo(i*pm,H);c.stroke()}
for(let j=0;j*pm<=H;j++){c.strokeStyle=j%5?C.g1:C.g2;c.beginPath();c.moveTo(0,j*pm);c.lineTo(W,j*pm);c.stroke()}
c.strokeStyle=C.tr;c.lineWidth=1.8;c.lineJoin='round';c.lineCap='round';c.beginPath();for(let x=0;x<=W;x+=.2){const t=o.now-secs+x/W*secs,y=Math.max(2,Math.min(H-2,mid-f(t)*o.g*pm));x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();
return{secs,W,H,c}}
let ac=null;function beep(){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.08)}catch(e){}}
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.1,(ts-(M.last||ts))/1000);M.last=ts;
if(M.on&&$('#ecg')){const p=M.now;if(!M.pause)M.now+=dt;fill();
if(M.beep&&!M.pause)for(const e of M.ev)if('QWRLDSV'.includes(e[1])&&e[0]>p&&e[0]<=M.now){beep();break}
const r=draw($('#ecg'),fM,{now:M.now,sp:M.sp,g:M.g,mid:M.mid});ovl(r);
if(M.cal.length){r.c.strokeStyle='#e0a020';r.c.setLineDash([4,3]);r.c.lineWidth=1.5;for(const t of M.cal){const x=(t-(M.now-r.secs))/r.secs*r.W;r.c.beginPath();r.c.moveTo(x,0);r.c.lineTo(x,r.H);r.c.stroke()}r.c.setLineDash([])}
if(M.cal.length==2){const ms=Math.abs(M.cal[1]-M.cal[0])*1000;$('#calr').textContent='Caliper: '+ms.toFixed(0)+' ms = '+(ms/40).toFixed(1)+' cuadros pequeños · equivale a '+(60000/ms).toFixed(0)+' lpm'}
if(GM.mode=='rapid'&&GM.open){const el=(performance.now()-GM.t0)/1000;$('#tm').textContent=Math.max(0,20-el).toFixed(0)+' s';if(el>20)rapidAns(-1)}}}
/* ===== Juego ===== */
const GM={mode:'lib',open:false,sc:0,st:0,best:0,n:0,t0:0,ans:''};
const ACT={a1:'Atropina 1 mg IV (repetir c/3–5 min, máx. 3 mg); si falla: marcapasos transcutáneo / dopamina / adrenalina',a2:'Cardioversión eléctrica sincronizada (sedar si es posible)',a3:'RCP + desfibrilación inmediata + adrenalina 1 mg c/3–5 min',a4:'Maniobras vagales → adenosina 6 mg rápida (luego 12 mg)',a5:'RCP de alta calidad + adrenalina 1 mg inmediata (no desfibrilable)',a6:'Amiodarona 150 mg IV en 10 min (o procainamida)',a7:'Sulfato de magnesio 2 g IV',a8:'Observación, sin tratamiento antiarrítmico'};
const CASES=[
{t:'Hombre 72 años, palpitaciones y mareo intenso.',v:'PA 82/50 · FC 150 · SatO₂ 91 % · FR 24 · confuso',id:'af',hr:150,st:0,a:'a2',ex:'FA con respuesta rápida INESTABLE (hipotensión + alteración mental): cardioversión sincronizada (120–200 J bifásico).'},
{t:'Mujer 80 años, síncope previo y fatiga.',v:'PA 78/46 · FC 36 · SatO₂ 94 % · FR 20 · somnolienta',id:'cav',hr:36,st:0,a:'a1',ex:'BAV completo inestable: atropina 1 mg (poco efectiva en infrahisiano), preparar marcapasos transcutáneo o infusión de dopamina/adrenalina.'},
{t:'Hombre 58 años colapsa en la sala de espera, sin respuesta.',v:'Sin pulso · apnea · SatO₂ no registrable',id:'vff',hr:0,st:0,a:'a3',ex:'FV: ritmo desfibrilable. RCP inmediata y descarga 120–200 J, adrenalina c/3–5 min, amiodarona 300 mg.'},
{t:'Mujer 27 años, inicio brusco de palpitaciones.',v:'PA 124/78 · FC 190 · SatO₂ 99 % · FR 18 · lúcida',id:'svt',hr:190,st:1,a:'a4',ex:'TSV regular QRS estrecho ESTABLE: maniobras vagales, luego adenosina 6 mg en bolo rápido + lavado.'},
{t:'Paciente en UCI con paro presenciado.',v:'Sin pulso · línea plana confirmada en 2 derivaciones',id:'asis',hr:0,st:0,a:'a5',ex:'Asistolia: no desfibrilable. RCP de calidad, adrenalina 1 mg lo antes posible y buscar 5H/5T.'},
{t:'Hombre 64 años con cardiopatía isquémica previa, palpitaciones.',v:'PA 118/74 · FC 170 · SatO₂ 96 % · FR 18 · lúcido, sin dolor',id:'vt',hr:170,st:1,a:'a6',ex:'TV monomórfica regular estable: amiodarona 150 mg en 10 min (alternativas: procainamida, sotalol); cardioversión si se inestabiliza.'},
{t:'Mujer 45 años con QT largo conocido, mareo recurrente, hipokalemia.',v:'PA 90/55 · pulso intermitente · SatO₂ 93 %',id:'tors',hr:200,st:0,a:'a7',ex:'Torsades de Pointes: sulfato de magnesio 2 g IV, corregir K⁺ y suspender fármacos que alargan el QT; desfibrilar si no hay pulso.'}];
function rapidNew(){const ids=Object.keys(RT).filter(i=>i!='vtsp'),id=ids[Math.floor(Math.random()*ids.length)];setR(id);M.pause=false;GM.ans=id;GM.open=true;GM.t0=performance.now();
const o=[id];while(o.length<4){const x=ids[Math.floor(Math.random()*ids.length)];if(!o.includes(x))o.push(x)}o.sort(()=>Math.random()-.5);
$('#game').innerHTML=`<h3>Diagnóstico rápido <span class="mu">· Aciertos: ${GM.sc}/${GM.n} · Racha: ${GM.st} (mejor ${GM.best}) · Tiempo: <b id="tm">20 s</b></span></h3><div class="row">${o.map(i=>`<button onclick="rapidAns('${i}')">${RT[i].n}</button>`).join('')}</div>`}
function rapidAns(i){if(!GM.open)return;GM.open=false;GM.n++;const ok=i==GM.ans;if(ok){GM.sc++;GM.st++;GM.best=Math.max(GM.best,GM.st)}else GM.st=0;
$('#game').innerHTML=`<h3 class="${ok?'':'wn'}">${ok?'¡Correcto!':i==-1?'Tiempo agotado.':'Incorrecto.'} Era: ${RT[GM.ans].n}</h3><p>${RT[GM.ans].cr}</p><button onclick="rapidNew()">Siguiente ritmo</button>`}
let CI=0;function caseNew(){CI=(CI+1)%CASES.length;caseShow()}
function caseShow(){const c=CASES[CI];setR(c.id,c.hr);M.pause=false;const rs=Object.values(RT);
$('#game').innerHTML=`<h3>Caso clínico ${CI+1}/${CASES.length}</h3><p><b>${c.t}</b><br>${c.v}</p><div class="row"><label>1) Ritmo: <select id="cr">${rs.map(r=>`<option value="${r.id}">${r.n}</option>`).join('')}</select></label>
<label>2) Estabilidad: <select id="cs"><option value="0">Inestable</option><option value="1">Estable</option></select></label></div><p class="mu">Inestable = hipotensión, alteración aguda del estado mental, shock, dolor torácico isquémico o insuficiencia cardíaca aguda.</p>
<label>3) Tratamiento: <select id="ca">${Object.entries(ACT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><p><button onclick="caseChk()">Evaluar decisión</button> <button onclick="caseNew()">Otro caso</button></p><div id="fb"></div>`}
function caseChk(){const c=CASES[CI],a=$('#cr').value,b=+$('#cs').value,d=$('#ca').value;const r=[a==c.id||(c.id=='vt'&&a=='vtsp'),b==c.st,d==c.a];
$('#fb').innerHTML=`<div class="cd">Ritmo: ${r[0]?'✔':'✘ '+RT[c.id].n}<br>Estabilidad: ${r[1]?'✔':'✘ '+(c.st?'estable':'inestable')}<br>Tratamiento: ${r[2]?'✔':'✘ '+ACT[c.a]}<br><b>${r.filter(x=>x).length}/3</b> — ${c.ex}</div>`}
function mode(m){GM.mode=m;GM.open=false;fxClear();$('#info').style.display=m=='lib'?'':'none';['lib','rapid','case'].forEach(x=>$('#md_'+x).classList.toggle('on',x==m));
if(m=='lib'){$('#game').innerHTML='';setR($('#rs').value,+$('#hr').value);info()}else if(m=='rapid')rapidNew();else caseShow()}
function v0(){const cats=[...new Set(Object.values(RT).map(r=>r.c))];return`<div class="cd"><div class="row"><button id="md_lib" class="on" onclick="mode('lib')">Exploración libre</button><button id="md_rapid" onclick="mode('rapid')">Diagnóstico rápido</button><button id="md_case" onclick="mode('case')">Simulación clínica</button></div></div>
<div class="cd"><div class="row"><select id="rs" onchange="pickR()">${cats.map(c=>`<optgroup label="${c}">${Object.values(RT).filter(r=>r.c==c).map(r=>`<option value="${r.id}">${r.n}</option>`).join('')}</optgroup>`).join('')}</select>

function lcg(s){return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)}
function pmSim(o){const T=12,ev=[],LRI=60/o.rate,rnd=lcg(7),nat=[],pint=[];const flags={fail:0,under:0,over:0,paces:0,cap:0,msg:[]};

else if(o.pt=='bs'){for(let t=.3;t<T;t+=1.5){pint.push(t);nat.push([t+.16,'Q',5])}}
else{let t=.5;while(t<T){nat.push([t,'Q',5]);t+=.9+1.3*rnd()}}
const noise=o.noise?[3.4,3.9,4.6,5.2,5.9,6.4,7.1,8.4,9.0]:[];
const natConn=o.pt=='bs';
if(o.pt!='fa')pint.forEach(t=>ev.push([t,'p']));nat.forEach(n=>ev.push([n[0],n[1]]));
const pace=(t,site)=>{flags.paces++;const cap=o.out>=o.thr;if(site=='v'){if(cap){ev.push([t,'S']);flags.cap++}else{ev.push([t,'k']);flags.fail++}}else{ev.push([t,'k']);if(cap&&o.pt!='fa')ev.push([t+.02,'p'])}};

if(o.mode=='VOO'){for(let t=.1;t<T;t+=LRI)pace(t,'v')}
else if(o.mode=='VVI'){let ref=0;const ex=nat.filter(n=>n[2]>o.sens).map(n=>n[0]).concat(noise).sort((a,b)=>a-b);nat.forEach(n=>{if(n[2]<=o.sens)flags.under++});if(o.noise&&noise.length)flags.over=noise.length;while(ref<T){const tp=ref+LRI,te=ex.find(x=>x>ref+.02);if(te!==undefined&&te<tp)ref=te;else{pace(tp,'v');ref=tp}}}
else if(o.mode=='AAI'){let ref=0;const pa=o.sens<2?pint.slice():[];if(o.sens>=2&&o.pt!='fa')flags.under=pint.length;if(o.pt=='fa'){while(ref<T){ref+=LRI;pace(ref,'a')}}else while(ref<T){const tp=ref+LRI,pe=pa.find(x=>x>ref+.02);if(pe!==undefined&&pe<tp)ref=pe;else{pace(tp,'a');ref=tp;if(natConn&&o.out>=o.thr)ev.push([tp+.16,'Q'])}}}
else{let refA=0,guard=0;const pa=o.sens<2&&o.pt!='fa'?pint.slice():[];if(o.sens>=2&&o.pt!='fa')flags.under=pint.length;while(refA<T&&guard++<200){const tp=refA+LRI,pe=pa.find(x=>x>refA+.02);let tA;if(pe!==undefined&&pe<tp)tA=pe;else{tA=tp;pace(tA,'a')}const tv=tA+o.avd/1000,tn=natConn?tA+.16:null;if(tn!==null&&tn<tv){}else if(noise.some(x=>x>=tA&&x<=tv)){flags.over++}else{pace(tv,'v')}refA=tA}}
const pv=ev.filter(e=>e[1]=='S').map(e=>e[0]);const ev2=ev.filter(e=>e[0]<=T&&!(e[1]=='W'&&pv.some(t=>t<e[0]&&e[0]-t<1.9)));const f=sampler(ev2,null);
if(flags.fail)flags.msg.push(`<span class="wn">Fallo de captura:</span> la salida (${o.out} mA) es menor que el umbral del paciente (${o.thr} mA): hay espigas sin QRS. Aumentar la salida.`);else if(flags.paces)flags.msg.push(`Captura efectiva: salida ${o.out} mA ≥ umbral ${o.thr} mA.`);
if(flags.under&&o.mode!='VOO')flags.msg.push(`<span class="wn">Subdetección:</span> sensibilidad programada (${o.sens} mV) demasiado alta para las ondas propias: el marcapasos estimula en competencia. Bajar el valor en mV.`);if(flags.over&&o.noise)flags.msg.push(`<span class="wn">Sobredetección:</span> el ruido se interpreta como latidos y inhibe la estimulación (pausas). Revisar electrodo y sensibilidad.`);
if(o.mode=='AAI'&&o.pt=='bav')flags.msg.push(`<span class="wn">Modo inapropiado:</span> AAI en un BAV completo: la aurícula se estimula pero no conduce; el paciente queda con su ritmo de escape lento.`);if(o.mode=='VVI'&&o.pt=='bav')flags.msg.push('VVI funciona pero pierde la sincronía AV (riesgo de síndrome de marcapasos).');if(o.mode=='DDD'&&o.pt=='bav')flags.msg.push('DDD sigue a la P sinusal y conserva la sincronía AV: el modo ideal para este paciente.');

function daiBuild(k){const ev=[],marks=[],fl=[];let base=null,vf=null;const sin=(a,b)=>{for(let t=a;t<b;t+=.8){ev.push([t,'p']);ev.push([t+.16,'Q'])}},vt=(a,b,rr)=>{for(let t=a;t<b;t+=rr)ev.push([t,'V',rr])};

function flSvg(items,s){const M0=meas(items),MR=16,W=M0.w+2*MR,H=M0.h+2*MR,C={nodes:[],edges:[]};place(items,W/2,MR,C,s);
return `<svg data-w='${W}' viewBox='0 0 ${W} ${H}' style='width:100%;max-width:${W}px;display:block;margin:auto'><defs><marker id='ar${s}' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='9' markerHeight='9' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='var(--mu)'/></marker></defs>${C.edges.map(e=>`<path class='fe' d='${e.p}' marker-end='url(#ar${s})'/>${e.l?`<text class='fl-${e.c}' x='${e.lx}' y='${e.ly}' text-anchor='${e.c=='y'?'end':'start'}'>${e.l}</text>`:''}`).join('')}${C.nodes.map(n=>`<g class='fn ${n.k}' data-nd='${n.id}' data-s='${s}'><rect x='${n.x}' y='${n.y}' width='${n.w}' height='${n.h}' rx='9'/>${wrap(n.t,25).map((l,i)=>`<text x='${n.x+n.w/2}' y='${n.y+FPAD+FLH*(i+.78)}' text-anchor='middle'>${esc(l)}</text>`).join('')}</g>`).join('')}</svg>`}
